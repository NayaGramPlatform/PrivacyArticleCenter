name: Restore privacy content
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Restore privacyContent.ts from last good commit and patch
        run: |
          set -e
          git show d17587d2e3bf40e75bc780876900ff8ae8fa4131:src/data/privacyContent.ts > src/data/privacyContent.ts
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/data/privacyContent.ts')
          t = p.read_text(encoding='utf-8')
          reps = [
            ('lastUpdated: "September 25, 2026"', 'lastUpdated: "23 October 2026"'),
            ('effectiveDate: "September 25, 2026"', 'effectiveDate: "23 October 2026"'),
            ('lastUpdated: "২৫ সেপ্টেম্বর, ২০২৬"', 'lastUpdated: "২৩ অক্টোবর, ২০২৬"'),
            ('effectiveDate: "২৫ সেপ্টেম্বর, ২০২৬"', 'effectiveDate: "২৩ অক্টোবর, ২০২৬"'),
            ('description: "Certified for transparent user privacy and data handling."',
             'description: "Aligned with Google Play User Data policy and Data Safety disclosure requirements."'),
            ('label: "Google Play সনদ"', 'label: "Google Play নীতিমালা"'),
            ('badge: "Official Telegram Client App"', 'badge: "Independent Telegram API Client"'),
            ('badge: "অফিশিয়াল টেলিগ্রাম ক্লায়েন্ট অ্যাপ"', 'badge: "স্বাধীন টেলিগ্রাম API ক্লায়েন্ট"'),
          ]
          for a,b in reps:
              t = t.replace(a,b)
          p.write_text(t, encoding='utf-8')
          print('privacyContent', p.stat().st_size)
          PY
      - name: Patch index.html (live GitHub Pages source)
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
            'Google Play Data Safety Certified • Updated October 2026',
            'Google Play Data Safety Form Ready • Updated 23 October 2026')
          t = t.replace(
            'গুগল প্লে ডেটা সেফটি সার্টিফাইড • অক্টোবর ২০২৬ হালনাগাদ',
            'গুগল প্লে ডেটা সেফটি ফর্ম প্রস্তুত • ২৩ অক্টোবর ২০২৬ হালনাগাদ')
          t = t.replace(
            'Google Play Data Safety compliant privacy charter.',
            'Google Play Data Safety form-aligned privacy charter.')
          logo = 'https://i.postimg.cc/65K5k2WS/%F0%9D%90%8D%F0%9D%90%9A%F0%9D%90%B2%F0%9D%90%9A-%F0%9D%90%86%F0%9D%90%AB%F0%9D%90%9A%F0%9D%90%A6-%F0%9D%90%8F%F0%9D%90%A5%F0%9D%90%9A%F0%9D%90%AD%F0%9D%90%9F%F0%9D%90%A8%F0%9D%90%AB%F0%9D%90%A6.png'
          t = t.replace('src="./assets/nayagram_logo.png"', f'src="{logo}"')
          p.write_text(t, encoding='utf-8')
          print('index.html', p.stat().st_size)
          assert 'Form Ready' in t
          assert '23 October 2026' in t
          PY
      - name: Commit and push
        run: |
          set -e
          git config user.name "NayaGramPlatform"
          git config user.email "287420619+NayaGramPlatform@users.noreply.github.com"
          git add src/data/privacyContent.ts index.html
          git status
          git commit -m "privacy: restore content, honest Play claims, date 23 Oct 2026, logo update" || echo "No changes"
          git push origin HEAD:main
